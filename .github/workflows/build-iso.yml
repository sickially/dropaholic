name: Build Dropaholic ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Liberar espaco em disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Gerar ISO (Debian trixie em container privilegiado)
        run: |
          set -o pipefail
          chmod +x build.sh config/hooks/live/*.hook.chroot
          docker run --rm --privileged \
            -v "$PWD":/work -w /work \
            -e DEBIAN_FRONTEND=noninteractive \
            debian:trixie \
            bash -c "apt-get update && apt-get install -y sudo && ./build.sh" \
            2>&1 | tee docker-build.log

      - name: Mostrar fim do log em caso de falha
        if: failure()
        run: |
          echo "===== ULTIMAS 120 LINHAS DO BUILD ====="
          tail -n 120 docker-build.log || true
          echo "===== LINHAS COM ERRO ====="
          grep -nE "^E:|Err:|ERROR|error:|No such file|Unable to locate|not found" docker-build.log | tail -n 40 || true

      - name: Ajustar permissoes (build rodou como root)
        if: always()
        run: sudo chown -R "$USER":"$USER" . || true

      - name: Checksum
        run: |
          cd out
          sha256sum *.iso | tee SHA256SUMS
          ls -lh

      - name: Enviar ISO como artefato
        uses: actions/upload-artifact@v4
        with:
          name: dropaholic-iso
          path: |
            out/*.iso
            out/SHA256SUMS
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Enviar log completo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: docker-build.log
          if-no-files-found: ignore
          retention-days: 7
